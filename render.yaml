services:
  - type: web
    name: xxxr
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: APP_URL
        value: https://xxxr.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_EMAIL
        value: rajuit1396@gmail.com
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
